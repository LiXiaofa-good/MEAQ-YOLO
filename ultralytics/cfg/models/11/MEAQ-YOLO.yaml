# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# yolo task=detect mode=train model=yolov11n.yaml data=data.yaml device=0 epochs=200 batch=16 imgsz=640 workers=6

# Parameters
nc: 1 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0: P1/2
  - [-1, 1, MRepConv, [64, 1]] # 1: stem enhance (stride=1)
  - [-1, 1, Conv, [128, 3, 2]] # 2: P2/4

  - [-1, 3, EShuffleNetV2, [128, 1, "eca", "silu"]] # 3

  - [-1, 1, EShuffleNetV2, [256, 2, "none", "silu"]] # 4: P3/8
  - [-1, 5, EShuffleNetV2, [256, 1, "eca", "silu"]] # 5  ()

  - [-1, 1, EShuffleNetV2, [512, 2, "none", "silu"]] # 6: P4/16
  - [-1, 3, EShuffleNetV2, [512, 1, "eca", "silu"]] # 7

  - [-1, 1, EShuffleNetV2, [1024, 2, "none", "silu"]] # 8: P5/32
  - [-1, 1, EShuffleNetV2, [1024, 1, "eca", "silu"]] # 9

  - [-1, 1, SPPF, [1024, 5]] # 10
  - [-1, 2, C2PSA, [1024]] # 11

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]] # 13 cat backbone P4 (index=12)
  - [-1, 2, C3k2, [512, False]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat backbone P3 (index=6)
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8-small)

  - [-1, 1, ADown, [256]] # 18 down to P4
  - [[-1, 14], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16-medium)

  - [-1, 1, ADown, [512]] # 21 down to P5
  - [[-1, 11], 1, Concat, [1]] # 22 cat backbone P5 (after C2PSA, index=19)
  - [-1, 2, C3k2, [1024, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, QDDHead, [nc]] # 32 Detect(P3,P4,P5)

